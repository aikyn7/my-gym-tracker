<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер тренировок</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f2;--card:#fff;--tx:#1b1b1b;--mut:#777;--bd:#e2e2dc;--ac:#2f6fed;--ok:#1fa75a;--okbg:#e3f6ea;--dg:#d33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121314;--card:#1c1d1f;--tx:#eee;--mut:#9a9a9a;--bd:#2c2e30;--ac:#6b9cff;--ok:#3ccf7d;--okbg:#14352299;--dg:#ff6b6b}}
:root[data-theme="dark"]{--bg:#121314;--card:#1c1d1f;--tx:#eee;--mut:#9a9a9a;--bd:#2c2e30;--ac:#6b9cff;--ok:#3ccf7d;--okbg:#14352299;--dg:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.ex.done{background:var(--okbg);border-color:var(--ok)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;color:#fff;font-weight:700;margin-top:2px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.bd{flex:1;min-width:0}
.nm{font-weight:600}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.pr{font-size:13px;margin-top:6px;color:var(--mut)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--dg);font-weight:600}
.wt{display:flex;align-items:center;gap:6px;margin-top:8px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.wt input{width:90px}
.btn{font:inherit;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--ac);color:#fff}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--dg);border:1px solid var(--bd);padding:6px 10px;font-size:13px}
.add{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:12px;margin-top:6px}
.add .r{display:flex;gap:8px}.add input{flex:1}
.fin{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.fin .btn{width:100%;max-width:640px;display:block;margin:0 auto;background:var(--ok);font-weight:600}
.fin .btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.st b{display:block;font-size:28px}.st span{color:var(--mut);font-size:13px}
h2{font-size:16px;margin:18px 0 8px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="w"><h1>🏋️ Мои тренировки</h1><div id="app"></div></div>
<script>
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(n,s,note)=>({id:uid(),n,s,note:note||''});
function seed(){return{days:[
{n:'День 1',d:'Пн',t:'Верх тела: грудь и плечи',ex:[
mk('Махи гантелями в стороны стоя (или на блоке)','3×12–15','Предварительно утомляем и разогреваем среднюю дельту'),
mk('Жим гантелей на наклонной скамье (30°)','3×8–10','Верх груди, скамья снимает нагрузку со спины'),
mk('Тяга верхнего блока к груди','3×8–10','Ширина спины'),
mk('Жим гантелей сидя на скамье с высокой спинкой (75–80°)','3×8–10','Передняя/средняя дельта без давления на поясницу'),
mk('Горизонтальная тяга в тренажере (упор грудью в подушку)','3×10–12','Упор грудью — безопасность для спины'),
mk('Суперсет: махи гантелями в стороны + сгибания на бицепс','3×12–15')]},
{n:'День 2',d:'Ср',t:'Ноги и кор',ex:[
mk('Жим ногами в тренажере','3×10–12','Поясница плотно прижата к спинке, колени глубоко к груди не тянуть'),
mk('Болгарские выпады с гантелями','3×10–12','На каждую ногу; квадрицепс и ягодицы без осевой нагрузки'),
mk('Сгибания ног сидя или лежа','3×12–15','Бицепс бедра'),
mk('Разгибания ног в тренажере','3×12–15'),
mk('Подъемы на носки в тренажере сидя','3×12–15','Икры'),
mk('Планка или скручивания на фитболе','3×до утомления','Кор без скручивания поясницы под весом')]},
{n:'День 3',d:'Пт',t:'«3D-плечи» + руки',ex:[
mk('Махи гантелями в стороны (или кроссовер)','4×12–15','Главное упражнение для шарообразных плеч'),
mk('Махи на заднюю дельту в пек-деке или кроссовере','4×12–15','Объем сбоку и сзади'),
mk('Тяга блока к лицу (Face Pulls)','3×12–15','Осанка, здоровье плеч, задняя дельта'),
mk('Французский жим с гантелями лежа','3×10–12','Трицепс'),
mk('Сгибания рук с гантелями «Молот»','3×10–12','Брахиалис и бицепс'),
mk('Разгибания рук на блоке с канатом','3×12–15','Трицепс')]}],cur:{},hist:[]}}
let S;try{S=JSON.parse(localStorage.getItem('gym1')||'null')}catch(e){}
if(!S)S=seed();
const save=()=>{try{localStorage.setItem('gym1',JSON.stringify(S))}catch(e){}};
const wd=new Date().getDay();
let tab=wd===3?1:wd===5?2:0,edit=false;
function lastW(name){for(let i=S.hist.length-1;i>=0;i--){const it=S.hist[i].items.find(x=>x.n===name&&x.w>0);if(it)return it.w}return 0}
function prog(){const m={};S.hist.forEach(h=>h.items.forEach(i=>{if(i.w>0){(m[i.n]=m[i.n]||[]).push(i.w)}}));return m}
function render(){
const A=document.getElementById('app');
let h='<div class="tabs">'+S.days.map((d,i)=>`<button class="tab ${tab===i?'on':''}" data-t="${i}">${d.d}<br><small>${d.n}</small></button>`).join('')+`<button class="tab ${tab==='s'?'on':''}" data-t="s">📊<br><small>Итоги</small></button></div>`;
if(tab==='s')h+=stats();else h+=day(S.days[tab]);
A.innerHTML=h;
}
function day(d){
const done=d.ex.filter(e=>(S.cur[e.id]||{}).done).length;
let h=`<p class="sub"><span>${esc(d.t)} · ${done}/${d.ex.length}</span><button class="btn g" data-a="edit">${edit?'Готово':'Править'}</button></p>`;
h+=d.ex.map(e=>{const c=S.cur[e.id]||{};const lw=lastW(e.n);
let p=lw?`Прошлый раз: ${lw} кг`:'Веса ещё не записаны';
if(lw&&c.w>0){const df=+(c.w-lw).toFixed(2);p+=` · <span class="${df>0?'up':df<0?'dn':''}">${df>0?'▲ +':df<0?'▼ ':'= '}${df||''}${df?' кг':''}</span>`}
return`<div class="ex ${c.done?'done':''}" data-id="${e.id}" data-a="tog"><div class="chk">${c.done?'✓':''}</div><div class="bd"><div class="nm">${esc(e.n)}</div><div class="meta">${esc(e.s)}${e.note?' · '+esc(e.note):''}</div>
<div class="wt"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${lw||'вес'}" value="${c.w||''}" data-w="${e.id}"> кг</div><div class="pr">${p}</div>
${edit?`<div style="margin-top:8px"><button class="btn d" data-a="del" data-id="${e.id}">Удалить</button></div>`:''}</div></div>`}).join('');
h+=`<div class="add"><b>Добавить упражнение</b><input id="an" placeholder="Название"><div class="r"><input id="as" placeholder="Подходы×повторы, напр. 3×10"><button class="btn" data-a="add">+</button></div></div>`;
h+=`<div class="fin"><button class="btn" data-a="fin" ${done?'':'disabled'}>Завершить тренировку (${done})</button></div>`;
return h}
function stats(){
const H=S.hist,ex=H.reduce((a,h)=>a+h.items.length,0),sets=H.reduce((a,h)=>a+h.items.reduce((b,i)=>b+(parseInt(i.s)||0),0),0);
const wk=H.filter(h=>Date.now()-h.ts<7*864e5).length;
const mx=Math.max(0,...H.flatMap(h=>h.items.map(i=>i.w||0)));
let h=`<div class="grid"><div class="st"><b>${H.length}</b><span>тренировок</span></div><div class="st"><b>${ex}</b><span>упражнений сделано</span></div><div class="st"><b>${sets}</b><span>подходов</span></div><div class="st"><b>${wk}</b><span>за последние 7 дней</span></div></div>`;
const P=prog(),ks=Object.keys(P);
h+='<h2>Прогресс по весам</h2>';
h+=ks.length?ks.map(k=>{const a=P[k],f=a[0],l=a[a.length-1],df=+(l-f).toFixed(2);return`<div class="row"><span>${esc(k)}</span><span style="white-space:nowrap">${f} → ${l} кг <span class="${df>0?'up':df<0?'dn':''}">${df>0?'+':''}${df}</span></span></div>`}).join(''):'<p class="meta">Запиши вес в упражнении и заверши тренировку — здесь появится прогресс.</p>';
h+='<h2>История</h2>';
h+=H.length?H.slice(-10).reverse().map(x=>`<div class="row"><span>${new Date(x.ts).toLocaleDateString('ru-RU')} · ${esc(x.day)}</span><span>${x.items.length} упр.</span></div>`).join(''):'<p class="meta">Пока пусто.</p>';
return h}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
document.addEventListener('click',ev=>{
const t=ev.target.closest('[data-t]');if(t){tab=t.dataset.t==='s'?'s':+t.dataset.t;render();return}
if(ev.target.matches('input'))return;
const el=ev.target.closest('[data-a]');if(!el)return;
const a=el.dataset.a,d=S.days[tab];
if(a==='edit'){edit=!edit}
else if(a==='tog'){const id=el.dataset.id,c=S.cur[id]=S.cur[id]||{};c.done=!c.done}
else if(a==='del'){ev.stopPropagation();d.ex=d.ex.filter(e=>e.id!==el.dataset.id)}
else if(a==='add'){const n=document.getElementById('an').value.trim();if(!n)return;d.ex.push(mk(n,document.getElementById('as').value.trim()||'3×10'))}
else if(a==='fin'){const items=d.ex.filter(e=>(S.cur[e.id]||{}).done).map(e=>({n:e.n,s:e.s,w:+S.cur[e.id].w||0}));
if(!items.length)return;S.hist.push({ts:Date.now(),day:d.n,items});d.ex.forEach(e=>delete S.cur[e.id]);toast('Тренировка сохранена 💪');}
save();render()});
document.addEventListener('input',ev=>{const id=ev.target.dataset.w;if(!id)return;const c=S.cur[id]=S.cur[id]||{};c.w=ev.target.value;save()});
render();
</script>
</body>
</html>
